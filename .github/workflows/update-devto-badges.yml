name: Update DEV.to Badges

on:
  schedule:
    # Runs at 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the badge card
        env:
          DEVTO_USERNAME: annavi11arrea1
        run: node scripts/update-badges.js

      - name: Commit updated badge card
        run: |
          if git diff --quiet -- assets/devto-badges.svg; then
            echo "Badges have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/devto-badges.svg
          git commit -m "Update DEV.to badges"
          git pull --rebase
          git push
