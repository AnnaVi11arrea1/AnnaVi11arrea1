name: Update DEV.to Followers Count

on:
  schedule:
    # Runs at midnight UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the update script
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_USERNAME: annavi11arrea1
        run: node scripts/update-followers.js

      - name: Commit updated badge
        run: |
          if git diff --quiet -- assets/devto-followers.svg; then
            echo "Follower count has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/devto-followers.svg
          git commit -m "Update DEV.to follower count"
          git push
